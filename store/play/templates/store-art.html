<!doctype html>
<!--
  Ridely Play Store listing art. Rendered to PNG by store/play/render.py:
    store-art.html?shot=<id>   (ids are listed in SHOTS below)

  Each device shows a recreation of the real app screen, built from the app's own
  styles (theme colours, sizes and copy from app/*.tsx). To use a real capture instead,
  drop it in store/play/raw/<screen>.png (home, tracking, pricing, rider, handoff, chat);
  it is laid over the recreation automatically.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridely store art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Roboto:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
  :root {
    --primary: #174AFF;
    --navy: #0B1040;
    --accent: #FFC947;
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --text: #1F2937;
    --text2: #6B7280;
    --text3: #9CA3AF;
    --border: #E5E7EB;
    --success: #10B981;
    --error: #EF4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy); }
  body { font-family: Roboto, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* ---------- Marketing stage ----------
     Flat saturated ground, one bright device, cards floating around it. */
  .canvas { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #06091A; color: #fff; }
  .canvas::before { /* brand glow sitting behind the device */
    content: ''; position: absolute; left: 50%; top: 54%; width: 780px; height: 780px; margin: -390px 0 0 -390px;
    background: radial-gradient(circle, rgba(23,74,255,.60) 0%, rgba(23,74,255,.20) 40%, rgba(6,9,26,0) 70%);
  }
  .canvas::after { /* faint dot grid, then a vignette to sink the edges */
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.3px);
    background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(64% 46% at 50% 46%, transparent 0%, #000 100%);
    mask-image: radial-gradient(64% 46% at 50% 46%, transparent 0%, #000 100%);
    box-shadow: inset 0 0 210px 48px rgba(3,5,18,.9);
  }
  .copy { position: absolute; z-index: 8; padding: 0 28px; }
  .copy.center { left: 0; right: 0; text-align: center; }
  .copy.left { left: 40px; right: auto; padding: 0; text-align: left; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font: 700 11px/1 'Plus Jakarta Sans', sans-serif; letter-spacing: .14em; text-transform: uppercase;
    color: var(--navy); background: var(--accent); padding: 7px 12px; border-radius: 999px;
  }
  .headline {
    font: 800 40px/1.06 'Plus Jakarta Sans', sans-serif; letter-spacing: -.025em;
    margin: 14px auto 0; max-width: 440px; text-wrap: balance;
  }
  .copy.left .headline { margin-left: 0; }
  .headline em { font-style: normal; color: var(--accent); }
  .sub { font: 400 15px/1.45 Roboto, sans-serif; color: rgba(255,255,255,.8); margin-top: 10px; text-wrap: balance; }
  .copy.left .sub { margin-left: 0; }

  /* ---------- Device ---------- */
  .device {
    position: absolute; left: 50%; transform: translateX(-50%); z-index: 2;
    background: #05070F; padding: 9px; border-radius: 44px;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.16) inset, 0 44px 84px rgba(2,5,25,.8), 0 0 90px rgba(23,74,255,.3);
  }
  .device.tablet { border-radius: 30px; padding: 14px; }
  .viewport { position: relative; overflow: hidden; border-radius: 36px; background: var(--bg); }
  .device.tablet .viewport { border-radius: 18px; }
  .screen { position: absolute; top: 0; left: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  .raw { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 50; }

  /* ---------- Floating cards ---------- */
  .float { position: absolute; z-index: 9; border-radius: 22px; box-shadow: 0 20px 44px rgba(2,5,25,.6), 0 2px 6px rgba(2,5,25,.45); }
  .f-white { background: #fff; color: var(--navy); }
  .f-blue { background: var(--primary); color: #fff; }
  .f-amber { background: var(--accent); color: var(--navy); }
  .f-green { background: var(--success); color: #fff; }
  .f-pad { padding: 16px 18px; }
  .f-ico { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; flex: none; }
  .f-ico svg.i { width: 21px; height: 21px; }
  .f-title { font: 700 15px/1.25 Roboto; }
  .f-sub { font: 400 12.5px/1.35 Roboto; opacity: .72; margin-top: 3px; }
  .f-value { font: 800 26px/1 Roboto; letter-spacing: -.02em; }
  .f-label { font: 500 12px Roboto; opacity: .72; margin-top: 4px; }
  .f-row { display: flex; align-items: center; gap: 12px; }
  .f-col { display: flex; flex-direction: column; }
  /* handoff code shown as four blocks, matching app/tracking.tsx */
  .f-digits { display: flex; gap: 7px; margin-top: 12px; }
  .f-digit { width: 38px; height: 46px; border-radius: 11px; background: var(--navy); color: #fff; display: grid; place-items: center; font: 800 24px Roboto; }
  .f-dot { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; flex: none; }
  .f-dot svg.i { width: 20px; height: 20px; }
  .f-chip { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 9px 15px; font: 700 13.5px Roboto; }

  /* ---------- Android chrome ---------- */
  .statusbar { height: 32px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font: 500 13px Roboto; color: var(--text); position: relative; z-index: 5; }
  .statusbar.light { color: #fff; }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; }
  .gesture { position: absolute; bottom: 7px; left: 50%; width: 108px; height: 4px; margin-left: -54px; border-radius: 4px; background: rgba(17,24,39,.55); z-index: 60; }

  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Shared app pieces ---------- */
  .shadow-s { box-shadow: 0 1px 4px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.04); }
  .shadow-m { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .shadow-l { box-shadow: 0 4px 12px rgba(0,0,0,.10); }
  .scroll { flex: 1; overflow: hidden; }
  .section { padding: 0 20px; margin-bottom: 28px; }
  .section-title { font: 700 20px Roboto; margin-bottom: 12px; }
  .row { display: flex; align-items: center; }
  .between { justify-content: space-between; }

  /* Home */
  .home-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 20px 22px; }
  .greeting { font: 700 24px Roboto; margin-bottom: 4px; }
  .subtitle { font: 400 16px Roboto; color: var(--text2); }
  .round48 { width: 48px; height: 48px; border-radius: 24px; background: var(--surface); display: grid; place-items: center; color: var(--primary); position: relative; }
  .badge-dot { position: absolute; top: 8px; right: 9px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--error); color: #fff; font: 700 11px/18px Roboto; text-align: center; padding: 0 4px; }
  .active-card { margin: 0 20px 28px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
  .active-map { height: 136px; position: relative; }
  .active-map svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .beacon { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 10px rgba(16,185,129,.18), 0 0 0 22px rgba(16,185,129,.08); }
  .beacon::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--success); }
  .pill-float { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,.94); border-radius: 999px; padding: 6px 10px; font: 700 11px Roboto; letter-spacing: .04em; color: var(--success); display: flex; gap: 6px; align-items: center; }
  .pill-float::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
  .active-body { padding: 14px 16px 16px; }
  .active-title { font: 700 18px Roboto; }
  .active-meta { font: 400 13px Roboto; color: var(--text2); margin-top: 4px; }
  .code-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: #EEF2FF; color: var(--primary); border-radius: 10px; padding: 7px 10px; font: 700 13px Roboto; letter-spacing: .06em; }
  .qa-grid { display: flex; flex-wrap: wrap; justify-content: space-between; row-gap: 16px; }
  .qa { width: 48%; border-radius: 20px; background: var(--surface); padding: 22px 12px; text-align: center; }
  .qa .ico { width: 60px; height: 60px; border-radius: 30px; display: grid; place-items: center; margin: 0 auto 10px; color: #fff; }
  .qa .t { font: 700 15px Roboto; margin-bottom: 4px; }
  .qa .s { font: 400 12px Roboto; color: var(--text2); opacity: .8; }
  .recent { border-radius: 16px; background: var(--surface); border: 1px solid var(--border); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .recent .d { font: 400 12px Roboto; color: var(--text2); margin-bottom: 4px; }
  .recent .r { font: 600 14px Roboto; margin-bottom: 4px; }
  .recent .st { font: 500 12px Roboto; }
  .recent .p { font: 700 16px Roboto; }
  .tabbar { flex: none; height: 64px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: 8px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font: 500 11px Roboto; color: var(--text3); }
  .tab.on { color: var(--primary); }
  .tab svg.i { width: 22px; height: 22px; }

  /* Map screens */
  .mapfill { position: absolute; inset: 0; }
  .mapfill svg.map { width: 100%; height: 100%; display: block; }
  .chrome { position: absolute; top: 32px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; z-index: 5; }
  .roundbtn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: #fff; background: rgba(0,0,0,.55); }
  .roundbtn svg.i { width: 21px; height: 21px; }
  .live { display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; background: rgba(16,185,129,.95); color: #fff; font: 700 13px Roboto; }
  .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 20px 26px; box-shadow: 0 -4px 18px rgba(0,0,0,.12); z-index: 6; }
  .handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 4px auto 14px; }
  .lead { display: flex; justify-content: space-between; align-items: flex-start; }
  .status-row { display: flex; align-items: center; gap: 8px; }
  .sdot { width: 10px; height: 10px; border-radius: 50%; }
  .status-title { font: 700 20px Roboto; }
  .eta { font: 600 15px Roboto; color: var(--primary); margin-top: 4px; }
  .elapsed { font: 500 14px Roboto; color: var(--text3); font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .primary-act { flex: 1; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; font: 700 16px Roboto; }
  .primary-act svg.i { width: 20px; height: 20px; }
  .sec-act { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--text); }
  .sec-act svg.i { width: 20px; height: 20px; }
  .details-toggle { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 14px; font: 500 14px Roboto; color: var(--text2); }
  .details-toggle svg.i { width: 16px; height: 16px; }
  .rider-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .avatar { width: 46px; height: 46px; border-radius: 23px; display: grid; place-items: center; color: #fff; font: 700 17px Roboto; background: linear-gradient(135deg, #4784FF, #174AFF); flex: none; }
  .rider-name { font: 700 16px Roboto; }
  .rider-sub { font: 400 13px Roboto; color: var(--text2); margin-top: 2px; }
  .rating { margin-left: auto; font: 700 14px Roboto; color: var(--text); display: flex; gap: 4px; align-items: center; }
  .rating svg.i { width: 16px; height: 16px; color: var(--accent); fill: var(--accent); }
  .code-card { margin-top: 16px; border-radius: 18px; padding: 16px; background: linear-gradient(135deg, #EEF2FF, #E0E8FF); border: 1px solid #C7D5FF; }
  .code-card .lbl { display: flex; align-items: center; gap: 8px; font: 700 13px Roboto; color: var(--primary); letter-spacing: .04em; text-transform: uppercase; }
  .code-card .lbl svg.i { width: 18px; height: 18px; }
  .digits { display: flex; gap: 10px; margin-top: 12px; }
  .digit { flex: 1; height: 62px; border-radius: 14px; background: #fff; display: grid; place-items: center; font: 900 32px Roboto; color: var(--navy); box-shadow: 0 2px 6px rgba(23,74,255,.12); }
  .code-card .hint { font: 400 13px/1.4 Roboto; color: var(--text2); margin-top: 12px; }
  .steps { margin-top: 16px; }
  .step { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; font: 500 14px Roboto; color: var(--text); }
  .step .b { width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; background: var(--success); color: #fff; flex: none; }
  .step .b svg.i { width: 13px; height: 13px; stroke-width: 3; }
  .step.todo { color: var(--text3); }
  .step.todo .b { background: var(--border); }
  .step.now .b { background: var(--primary); }

  /* Pricing */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 20px 16px; }
  .backsq { width: 44px; height: 44px; border-radius: 22px; background: #F3F4F6; display: grid; place-items: center; color: var(--text); }
  .topbar .t { font: 700 20px Roboto; }
  .topbar .s { font: 400 13px Roboto; color: var(--text2); margin-top: 2px; }
  .progress { height: 6px; border-radius: 3px; background: var(--border); margin: 0 20px 18px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 75%; background: var(--primary); border-radius: 3px; }
  .card { background: var(--surface); border-radius: 16px; padding: 18px; margin: 0 20px 16px; }
  .price-card { border: 2px solid var(--primary); display: flex; align-items: center; gap: 12px; }
  .price-card .total { font: 800 30px Roboto; color: var(--primary); }
  .price-card .lbl { font: 400 13px Roboto; color: var(--text2); }
  .time-pill { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--success); font: 600 14px Roboto; }
  .time-pill svg.i { width: 20px; height: 20px; }
  .card-title { font: 700 17px Roboto; margin-bottom: 12px; }
  .detail { display: flex; gap: 12px; align-items: center; padding: 7px 0; font: 400 14px Roboto; }
  .detail svg.i { width: 20px; height: 20px; }
  .bd { display: flex; justify-content: space-between; font: 400 14px Roboto; color: var(--text2); padding: 4px 0; }
  .bd b { color: var(--text); font-weight: 600; }
  .divider { height: 1px; background: var(--border); margin: 10px 0; }
  .bd.total { font: 700 16px Roboto; color: var(--text); }
  .bd.total b { color: var(--primary); font-weight: 800; }
  .paybox { display: flex; gap: 10px; }
  .payopt { flex: 1; border: 1.5px solid var(--border); border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: center; font: 600 14px Roboto; }
  .payopt.on { border-color: var(--primary); background: #EEF2FF; color: var(--primary); }
  .payopt svg.i { width: 20px; height: 20px; }
  .secure { display: flex; gap: 6px; align-items: center; justify-content: center; font: 500 12px Roboto; color: var(--text2); margin-top: 12px; }
  .secure svg.i { width: 14px; height: 14px; color: var(--success); }
  .bottom-cta { flex: none; background: var(--surface); border-top: 1px solid var(--border); padding: 14px 20px 26px; }
  .cta { height: 54px; border-radius: 14px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 17px Roboto; }
  .cta svg.i { width: 20px; height: 20px; }

  /* Rider dashboard */
  .rd-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 18px; }
  .rd-head .greeting { font-size: 22px; }
  .online { display: flex; align-items: center; gap: 8px; margin-top: 6px; font: 600 14px Roboto; color: var(--success); }
  .online .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--success); }
  .switch { width: 44px; height: 26px; border-radius: 13px; background: #A7F3D0; position: relative; }
  .switch::after { content: ''; position: absolute; right: 2px; top: 2px; width: 22px; height: 22px; border-radius: 11px; background: var(--success); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .stats { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 16px; }
  .stat { flex: 1; background: var(--surface); border-radius: 16px; padding: 14px 8px; text-align: center; }
  .stat svg.i { margin: 0 auto 6px; display: block; }
  .stat .v { font: 800 18px Roboto; }
  .stat .l { font: 500 11px Roboto; color: var(--text2); margin-top: 2px; }
  .rd-actions { display: flex; gap: 8px; padding: 0 20px; margin-bottom: 22px; }
  .rd-act { flex: 1; height: 46px; border-radius: 12px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 5px; font: 700 11.5px Roboto; white-space: nowrap; }
  .rd-act svg.i { width: 16px; height: 16px; }
  .job { position: relative; background: var(--surface); border-radius: 18px; padding: 18px; margin: 0 20px 16px; }
  .urgent { position: absolute; top: -9px; right: 16px; background: var(--error); color: #fff; font: 800 10.5px Roboto; letter-spacing: .08em; padding: 5px 10px; border-radius: 8px; }
  .job-id { font: 700 16px Roboto; }
  .ago { font: 400 12px Roboto; color: var(--text2); margin-top: 2px; }
  .reward { text-align: right; }
  .reward .a { font: 800 22px Roboto; color: var(--success); }
  .reward .l { font: 400 12px Roboto; color: var(--text2); }
  .size { display: flex; gap: 8px; align-items: center; font: 600 14px Roboto; }
  .size i { width: 10px; height: 10px; border-radius: 5px; background: var(--accent); }
  .addr { margin-top: 12px; background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .addr .a { display: flex; gap: 8px; align-items: center; font: 400 14px Roboto; padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .addr .a svg.i { width: 16px; height: 16px; }
  .addr .sep { height: 12px; border-left: 2px dotted var(--text3); margin-left: 7px; }
  .meta { display: flex; gap: 18px; margin-top: 12px; font: 400 13px Roboto; color: var(--text2); }
  .meta span { display: flex; gap: 5px; align-items: center; }
  .meta svg.i { width: 16px; height: 16px; }
  .job-btns { display: flex; gap: 10px; margin-top: 16px; }
  .reject { flex: 1; height: 48px; border-radius: 12px; border: 1.5px solid var(--error); background: rgba(239,68,68,.12); color: var(--error); display: flex; align-items: center; justify-content: center; gap: 6px; font: 700 15px Roboto; }
  .accept { flex: 2; height: 48px; border-radius: 12px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; font: 700 15px Roboto; }
  .reject svg.i, .accept svg.i { width: 20px; height: 20px; }

  /* Chat */
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 8px 16px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .chat-head .n { font: 700 17px Roboto; }
  .chat-head .s { font: 400 12.5px Roboto; color: var(--success); margin-top: 2px; }
  .callbtn { margin-left: auto; width: 44px; height: 44px; border-radius: 22px; background: #EEF2FF; color: var(--primary); display: grid; place-items: center; }
  .callbtn svg.i { width: 20px; height: 20px; }
  .msgs { flex: 1; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .day { align-self: center; font: 500 12px Roboto; color: var(--text3); background: #EEF0F4; padding: 4px 10px; border-radius: 999px; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 18px; font: 400 15px/1.35 Roboto; }
  .bubble .tm { display: block; font: 400 11px Roboto; opacity: .7; margin-top: 4px; text-align: right; }
  .me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 6px; }
  .them { align-self: flex-start; background: var(--surface); color: var(--text); border-bottom-left-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .callcard { align-self: flex-start; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 16px; padding: 10px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); font: 500 14px Roboto; }
  .callcard .c { width: 34px; height: 34px; border-radius: 17px; background: rgba(16,185,129,.14); color: var(--success); display: grid; place-items: center; }
  .callcard .c svg.i { width: 17px; height: 17px; }
  .callcard small { display: block; font: 400 12px Roboto; color: var(--text2); }
  .composer { flex: none; display: flex; gap: 10px; align-items: center; padding: 12px 16px 26px; background: var(--bg); }

  const pts = (a) => a.map((p) => p.join(',')).join(' ');
  const major = [
    'M-20 520 L380 70', 'M-20 300 L380 300', 'M200 -20 L200 800', 'M-20 150 L380 150',

  const minor = [
    'M90 -20 L90 800', 'M300 -20 L300 800', 'M-20 430 L380 430', 'M-20 225 L380 225',
    'M-20 370 L380 370', 'M150 -20 L150 520', 'M250 -20 L250 520', 'M-20 80 L380 80',
    'M40 -20 L40 520', 'M345 -20 L345 520',
  ];
  const road = (d, w, c) => `<path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const pinImg = (kind, x, y) => {
    const w = kind === 'rider' ? 40 : 36, h = kind === 'rider' ? 51 : 41;
    return `<image href="${PINS[kind]}" x="${x - w / 2}" y="${y - h}" width="${w}" height="${h}"/>`;
  };
  return `<svg class="map" viewBox="0 0 360 ${height}" preserveAspectRatio="xMidYMin slice" xmlns="http://www.w3.org/2000/svg">
    <rect width="360" height="${height}" fill="#F4F4F2"/>
    <path d="M0 560 C80 530 150 590 225 630 C285 662 330 700 360 705 L360 ${height} L0 ${height} Z" fill="#D6E2EE"/>

      ${[[50,90],[160,90],[260,90],[50,160],[100,235],[160,235],[260,235],[50,310],[160,310],[210,310],[260,380],[210,440],[50,440]]
        .map(([x, y]) => `<rect x="${x}" y="${y}" width="32" height="${y > 400 ? 60 : 50}" rx="4"/>`).join('')}
    </g>
    ${minor.map((d) => road(d, 9, '#E3E3E3')).join('')}
    ${minor.map((d) => road(d, 7, '#FFFFFF')).join('')}
    ${major.map((d) => road(d, 15, '#DADADA')).join('')}
    ${major.map((d) => road(d, 12, '#FFFFFF')).join('')}
    ${labels ? `<g font-family="Roboto, sans-serif" font-size="9" fill="#A8A8A8" font-weight="500">
      <text x="22" y="296">Adeola Odeku St</text>
      <text x="236" y="146">Admiralty Way</text>
      <text x="120" y="605" fill="#9FB2C6" font-style="italic">Lagos Lagoon</text>
    </g>` : ''}
    ${route.length ? `<polyline points="${pts(route)}" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${pts(route)}" fill="none" stroke="#174AFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    ${trail.length ? `<polyline points="${pts(trail)}" fill="none" stroke="rgba(11,16,64,.78)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    ${pins.pickup ? pinImg('pickup', ...pins.pickup) : ''}
    ${pins.dropoff ? pinImg('dropoff', ...pins.dropoff) : ''}
    ${pins.rider ? pinImg('rider', ...pins.rider) : ''}
  </svg>`;
}

function renderShot(id) {
  const shot = SHOTS[id];
  const root = document.getElementById('root');
  if (!shot) { root.innerHTML = `<p style="color:#fff;padding:20px">Unknown shot "${id}". Try: ${Object.keys(SHOTS).join(', ')}</p>`; return; }

  if (shot.feature) {
    root.innerHTML = `<div class="feature">
      <img class="wordmark" src="../../../assets/images/logo-wordmark-dark.png" alt="Ridely">
      <h1>Deliveries, <em>made simple.</em></h1>
      <p>Book a package, track your rider live and pay securely. Or hop on as a rider and earn.</p>
      <div class="float f-pad f-amber" style="left:300px;top:22px;width:112px">
        <div style="font:800 19px Roboto">₦4,200</div>
        <div style="font:500 11px Roboto;opacity:.7;margin-top:3px">14.00 km · 25 min</div>
      </div>
      <div class="float f-pad f-green" style="left:286px;top:150px;width:120px">
        <div style="font:700 13px Roboto">In Transit</div>
        <div style="font:500 11px Roboto;color:#fff;opacity:.85;margin-top:3px">ETA 12 mins</div>
      </div>
      <img class="rider" src="rider.png" alt="">
      <div class="device" style="left:auto;right:22px;transform:none;top:20px;padding:5px;border-radius:26px">
        <div class="viewport" style="width:138px;height:298px;border-radius:21px"><div class="screen" id="scr"></div></div>
      </div>
    </div>`;
    mountScreen('tracking', 138, 298, 360);
    return;
  }

  const [W, H] = shot.size;
  const L = LAYOUT[shot.kind];
  const bezel = L.tablet ? 28 : 18;
  const viewW = L.devW - bezel;
  const scale = viewW / (L.tablet ? L.devW : 360);
  const viewH = H - L.devTop - bezel;
  const logicalH = Math.round(viewH / scale);

  root.innerHTML = `<div class="canvas">
    <div class="copy ${shot.align}" style="top:${L.copyTop}px${shot.align === 'left' ? `;width:${L.copyW}px` : ''}">
      <span class="eyebrow">${shot.eyebrow}</span>
      <div class="headline" style="font-size:${L.headFont}px;max-width:${L.headW}px">${shot.headline}</div>
      <div class="sub" style="font-size:${L.subFont}px">${shot.sub}</div>
    </div>
    <div class="device${L.tablet ? ' tablet' : ''}" style="top:${L.devTop}px;width:${L.devW}px">
      <div class="viewport" style="width:${viewW}px;height:${viewH}px"><div class="screen" id="scr"></div></div>
    </div>
    <div class="floats">
      ${(shot.floats || []).map((f) => `<div class="float f-pad ${f.tone}" style="

          top:${Math.round(f.y * H - (L.tablet ? 40 : 0))}px;
          width:${L.cardW}px">${f.body}</div>`).join('')}
    </div>
  </div>`;
  mountScreen(shot.screen, viewW, viewH, L.tablet ? L.devW : 360, logicalH);
}

function mountScreen(name, pxW, pxH, logicalW, logicalH) {
  const scale = pxW / logicalW;
  const h = logicalH ?? Math.round(pxH / scale);
  SCREEN_H = Math.max(780, Math.round((h * 360) / logicalW));
  const scr = document.getElementById('scr');
  scr.style.width = logicalW + 'px';
  scr.style.height = h + 'px';
  scr.style.transform = `scale(${scale})`;
  scr.innerHTML = SCREENS[name]() + '<span class="gesture"></span>';
  // A real capture in store/play/raw/<name>.png replaces the recreation.
  const raw = new Image();
  raw.className = 'raw';
  raw.onload = () => scr.appendChild(raw);
  raw.src = `../raw/${name}.png`;
}

renderShot(new URLSearchParams(location.search).get('shot') || 'phone-02');
